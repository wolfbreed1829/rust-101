name: Publish browser demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust with browser target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-wasip1
          rustup default stable
      - name: Compile the lesson programs
        run: python3 scripts/build_demo.py
      - name: Compare browser output to native Rust
        run: node scripts/check_demo.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload demo
        uses: actions/upload-pages-artifact@v5
        with:
          path: demo
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish demo
        id: deployment
        uses: actions/deploy-pages@v5
